<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>検索結果 — 怪獣大図鑑</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif JP',serif;background:#f5f0e8;color:#2a1a08;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 60px}
header{border-bottom:4px double #8b4513;margin-bottom:0;padding:20px 0 14px;text-align:center}
header::before{content:'★ ウルトラ怪獣大図鑑 ★';display:block;font-size:11px;letter-spacing:.3em;color:#8b4513;margin-bottom:8px;font-family:'Noto Sans JP',sans-serif}
.site-title{font-size:clamp(22px,5vw,38px);font-weight:900;color:#1a0a00;letter-spacing:.05em;line-height:1.1}
.site-title span{color:#c0392b}
.site-byline{font-size:11px;color:#8b6040;margin-top:6px;letter-spacing:.15em;font-family:'Noto Sans JP',sans-serif}
.stamp{display:inline-block;border:2px solid #c0392b;color:#c0392b;font-size:10px;padding:2px 8px;letter-spacing:.2em;font-family:'Noto Sans JP',sans-serif;transform:rotate(-2deg);margin-top:6px}
nav{display:flex;border:2px solid #2a1a08;margin-bottom:20px;margin-top:16px}
.nav-tab{flex:1;padding:11px 8px;background:#d4c9b0;border:none;border-right:2px solid #2a1a08;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:700;color:#2a1a08;cursor:pointer;letter-spacing:.08em;transition:all .15s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.nav-tab:last-child{border-right:none}
.nav-tab:hover{background:#b8a88a;color:#1a0a00}
.nav-tab.active{background:#2a1a08;color:#f5f0e8}
.kaiju-grid{display:grid;grid-template-columns:1fr;gap:14px}
.kcard{background:#fffdf7;border:1px solid #c0a070;padding:14px;cursor:pointer;transition:all .15s;position:relative}
.kcard::after{content:'';position:absolute;bottom:-3px;right:-3px;width:100%;height:100%;background:#8b6040;z-index:-1}
.kcard:hover{transform:translate(-2px,-2px)}
.kcard-num{font-size:10px;color:#b09070;letter-spacing:.15em;font-family:'Noto Sans JP',sans-serif;margin-bottom:4px}
.kcard-name{font-size:17px;font-weight:900;color:#1a0a00;margin-bottom:4px;letter-spacing:.05em}
.kcard-series{font-size:11px;color:#8b4513;border-left:3px solid #8b4513;padding-left:6px;margin-bottom:8px;font-family:'Noto Sans JP',sans-serif;letter-spacing:.05em}
.kcard-desc{font-size:12px;color:#4a3020;line-height:1.7}
.kcard-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ktag{padding:2px 7px;background:#2a1a08;color:#f5e8d0;font-size:10px;font-family:'Noto Sans JP',sans-serif;letter-spacing:.08em}
.ktag.r{background:#8b1a1a;color:#ffe0d0}
.ktag.g{background:#1a4a1a;color:#d0ffe0}
.fav-btn{position:absolute;top:10px;right:10px;background:none;border:1px solid #c0a070;width:26px;height:26px;cursor:pointer;font-size:14px;color:#b09070;display:flex;align-items:center;justify-content:center;transition:all .15s}
.fav-btn.on{background:#c0392b;border-color:#c0392b;color:#fff}
.fav-btn:hover{border-color:#8b4513}
.btn-s{padding:8px 20px;background:#fffdf7;border:1px solid #8b6040;font-family:'Noto Serif JP',serif;font-size:13px;cursor:pointer;color:#2a1a08;transition:all .15s;letter-spacing:.05em}
.btn-s:hover{background:#2a1a08;color:#f5f0e8;border-color:#2a1a08}
.btn-r{padding:8px 20px;background:#fffdf7;border:1px solid #c0392b;font-family:'Noto Serif JP',serif;font-size:13px;cursor:pointer;color:#c0392b;transition:all .15s;letter-spacing:.05em}
.btn-r:hover{background:#c0392b;color:#fff}
.hid{display:none!important}
.loading{text-align:center;padding:40px;color:#7a5030;font-family:'Noto Sans JP',sans-serif;font-size:13px;letter-spacing:.1em}
.dot{display:inline-block;width:6px;height:6px;background:#8b4513;border-radius:50%;margin:0 3px;animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.empty{text-align:center;padding:36px;color:#8b6040;font-family:'Noto Sans JP',sans-serif;font-size:13px;border:1px dashed #c0a070}
.cond-bar{background:#ede5d0;border:1px solid #c0a070;padding:8px 12px;margin-bottom:12px;font-family:'Noto Sans JP',sans-serif;font-size:12px;color:#5a3a1a;letter-spacing:.05em}
.cond-bar strong{font-weight:700;color:#2a1a08}
.result-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.result-count{font-size:12px;color:#7a5030;font-family:'Noto Sans JP',sans-serif;letter-spacing:.08em;white-space:nowrap}
.sort-row{display:flex;border:1px solid #c0a070}
.sort-btn{padding:4px 11px;background:#fffdf7;border:none;border-right:1px solid #c0a070;font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;color:#5a3a1a;transition:all .15s;letter-spacing:.05em;white-space:nowrap}
.sort-btn:last-child{border-right:none}
.sort-btn.on{background:#2a1a08;color:#f5f0e8}
.sort-btn:hover:not(.on){background:#ede5d0}
.site-footer{margin-top:40px;padding:16px 0;border-top:1px solid #c0a070;text-align:center;font-family:'Noto Sans JP',sans-serif;font-size:10px;color:#9a7050;line-height:2;letter-spacing:.08em}
.site-footer a{color:#8b6040;text-decoration:none}
.site-footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="site-title">怪獣<span>大図鑑</span></div>
  <div class="site-byline">ULTRAMAN SERIES</div>
  <div class="stamp">非公式ファンサイト</div>
</header>

<nav>
  <a class="nav-tab active" href="index.html">← 怪獣検索</a>
  <a class="nav-tab" href="index.html">▶ クイズ</a>
  <a class="nav-tab" href="index.html">▶ お気に入り</a>
  <a class="nav-tab" href="ultraman_list.html" style="border-right:none">▶ ウルトラマン</a>
</nav>

<div class="cond-bar" id="cond-bar"></div>

<div id="result-bar" class="result-bar hid">
  <span class="result-count" id="result-count"></span>
  <div class="sort-row">
    <button class="sort-btn on" data-s="name" onclick="sortBy(this)">名前順</button>
    <button class="sort-btn" data-s="series" onclick="sortBy(this)">シリーズ順</button>
    <button class="sort-btn" data-s="ep" onclick="sortBy(this)">登場話順</button>
  </div>
</div>

<div id="s-loading" class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><br><br>データを取得中…</div>
<div id="s-empty" class="empty hid">該当する怪獣が見つかりませんでした</div>
<div id="k-grid" class="kaiju-grid"></div>

</div>

<footer class="site-footer">
  このサイトは非公式のファンサイトです。円谷プロダクションとは一切関係ありません。<br>
  ウルトラマンシリーズに関するすべての著作権は © TSUBURAYA PRODUCTIONS CO., LTD. に帰属します。<br>
  当サイトはお気に入り機能のためブラウザのローカルストレージを使用しています。個人情報の収集は行っていません。
</footer>

<script>
const DATA_KAIJU = 'data/kaiju.json';
let allK = [], curSort = "name";
let kaijuDB = null;
let favs = JSON.parse(localStorage.getItem('kaiju_favs') || '[]');

const SERIES_ORDER = ['初代ウルトラマン','ウルトラセブン','帰ってきたウルトラマン','ウルトラマンA','ウルトラマンタロウ','ウルトラマンレオ','ウルトラマン80','ウルトラマンティガ','ウルトラマンダイナ','ウルトラマンガイア','ウルトラマンコスモス','ウルトラマンネクサス','ウルトラマンマックス','ウルトラマンメビウス','ウルトラマンゼロ'];

async function loadKaijuDB() {
  if (kaijuDB) return kaijuDB;
  const res = await fetch(DATA_KAIJU);
  kaijuDB = await res.json();
  return kaijuDB;
}

async function fetchFromDB(params = {}) {
  const data = await loadKaijuDB();
  let filtered = [...data];
  if (params.nameSearch) {
    const kw = params.nameSearch.toLowerCase();
    filtered = filtered.filter(k => (k.name || '').toLowerCase().includes(kw));
  }
  if (params.aliasSearch) {
    const kw = params.aliasSearch.toLowerCase();
    filtered = filtered.filter(k => (k.tags || '').toLowerCase().includes(kw));
  }
  if (params.series) {
    filtered = filtered.filter(k => k.series === params.series);
  }
  if (params.episode) {
    filtered = filtered.filter(k => epNum(k.episode) === parseInt(params.episode));
  }
  if (params.typeFilter) {
    filtered = filtered.filter(k => (k.type || '') === params.typeFilter);
  }
  if (params.tagFilter) {
    filtered = filtered.filter(k =>
      (k.tags || '').split('・').map(t => t.trim()).includes(params.tagFilter)
    );
  }
  filtered.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja'));
  return filtered;
}

function epNum(ep) {
  return parseInt((ep || '').match(/\d+/)?.[0]) || 0;
}

function applySort() {
  if (curSort === 'name') {
    allK.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja'));
  } else if (curSort === 'series' || curSort === 'ep') {
    allK.sort((a, b) => {
      const ai = SERIES_ORDER.indexOf(a.series), bi = SERIES_ORDER.indexOf(b.series);
      if (ai !== bi) { if (ai === -1) return 1; if (bi === -1) return -1; return ai - bi; }
      return epNum(a.episode) - epNum(b.episode);
    });
  }
}

function sortBy(el) {
  curSort = el.dataset.s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('on', b.dataset.s === curSort));
  applySort();
  renderGrid();
}

function renderGrid() {
  hide('s-empty');
  const resultBar = document.getElementById('result-bar');
  if (!allK.length) {
    show('s-empty');
    document.getElementById('k-grid').innerHTML = '';
    resultBar.classList.add('hid');
    return;
  }
  resultBar.classList.remove('hid');
  document.getElementById('result-count').textContent = `${allK.length}件ヒット`;
  document.getElementById('k-grid').innerHTML = allK.map((k, i) => `
    <div class="kcard">
      <button class="fav-btn ${isFav(k.name) ? 'on' : ''}" onclick="toggleFav(event,${i})">★</button>
      <div class="kcard-num">No.${String(i + 1).padStart(3, '0')}</div>
      <div class="kcard-name">${k.name}</div>
      <div class="kcard-series">${k.series || ''}</div>
      <div class="kcard-desc">${(k.desc || '').substring(0, 60)}…</div>
      <div class="kcard-tags"><span class="ktag ${k.tc || ''}">${k.tags || ''}</span></div>
    </div>
  `).join('');
  document.querySelectorAll('.kcard').forEach((c, i) => c.addEventListener('click', e => {
    if (e.target.classList.contains('fav-btn')) return;
    window.location.href = 'kaiju_detail.html?name=' + encodeURIComponent(allK[i].name);
  }));
}

function isFav(name) { return favs.some(f => f.name === name); }
function saveFavs() { localStorage.setItem('kaiju_favs', JSON.stringify(favs)); }

function toggleFav(e, idx) {
  e.stopPropagation();
  const k = allK[idx];
  if (isFav(k.name)) favs = favs.filter(f => f.name !== k.name);
  else favs.push(k);
  saveFavs(); renderGrid();
}

function show(id) { document.getElementById(id).classList.remove('hid'); }
function hide(id) { document.getElementById(id).classList.add('hid'); }

function buildCondLabel(p) {
  const parts = [];
  if (p.get('name')) parts.push(`怪獣名「${p.get('name')}」`);
  if (p.get('alias')) parts.push(`別名「${p.get('alias')}」`);
  if (p.get('series')) parts.push(`<strong>${p.get('series')}</strong>`);
  if (p.get('ep')) parts.push(`第${p.get('ep')}話`);
  if (p.get('type')) parts.push(`種別「${p.get('type')}」`);
  if (p.get('tag')) parts.push(`別名「${p.get('tag')}」`);
  return parts.length ? `検索条件：${parts.join(' · ')}` : '全件表示';
}

async function init() {
  const p = new URLSearchParams(location.search);
  document.getElementById('cond-bar').innerHTML = buildCondLabel(p);

  const params = {};
  if (p.get('name')) params.nameSearch = p.get('name');
  if (p.get('alias')) params.aliasSearch = p.get('alias');
  if (p.get('series')) params.series = p.get('series');
  if (p.get('ep')) params.episode = p.get('ep');
  if (p.get('type')) params.typeFilter = p.get('type');
  if (p.get('tag')) params.tagFilter = p.get('tag');

  try {
    allK = await fetchFromDB(params);
    hide('s-loading');
    renderGrid();
  } catch(e) {
    hide('s-loading');
    show('s-empty');
  }
}

init();
</script>
</body>
</html>
