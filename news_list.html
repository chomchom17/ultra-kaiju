<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最新情報 — 怪獣大図鑑</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif JP',serif;background:#f5f0e8;color:#2a1a08;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 60px}
header{border-bottom:4px double #8b4513;margin-bottom:0;padding:20px 0 14px;text-align:center}
header::before{content:'★ ウルトラ怪獣大図鑑 ★';display:block;font-size:11px;letter-spacing:.3em;color:#8b4513;margin-bottom:8px;font-family:'Noto Sans JP',sans-serif}
.site-title{font-size:clamp(22px,5vw,38px);font-weight:900;color:#1a0a00;letter-spacing:.05em;line-height:1.1}
.site-title span{color:#c0392b}
.site-byline{font-size:11px;color:#8b6040;margin-top:6px;letter-spacing:.15em;font-family:'Noto Sans JP',sans-serif}
.stamp{display:inline-block;border:2px solid #c0392b;color:#c0392b;font-size:10px;padding:2px 8px;letter-spacing:.2em;font-family:'Noto Sans JP',sans-serif;transform:rotate(-2deg);margin-top:6px}
nav{display:flex;border:2px solid #2a1a08;margin-bottom:24px;margin-top:16px}
.nav-tab{flex:1;padding:11px 8px;background:#d4c9b0;border:none;border-right:2px solid #2a1a08;font-family:'Noto Serif JP',serif;font-size:14px;font-weight:700;color:#2a1a08;cursor:pointer;letter-spacing:.08em;transition:all .15s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.nav-tab:last-child{border-right:none}
.nav-tab:hover{background:#b8a88a;color:#1a0a00}
.nav-tab.active{background:#2a1a08;color:#f5f0e8}
.page-heading{font-size:18px;font-weight:900;letter-spacing:.08em;color:#1a0a00;margin-bottom:4px}
.page-meta{font-size:11px;color:#8b6040;font-family:'Noto Sans JP',sans-serif;letter-spacing:.05em;margin-bottom:16px}
.news-box{border:1px solid #c0a070;background:#fffdf7}
.news-list{list-style:none}
.news-item{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid #f0e8d8;flex-wrap:wrap}
.news-item:last-child{border-bottom:none}
.news-date{font-size:11px;color:#9a7050;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;flex-shrink:0;letter-spacing:.03em}
.news-item a{font-size:13px;color:#2a1a08;text-decoration:none;flex:1;font-family:'Noto Sans JP',sans-serif;min-width:0;letter-spacing:.02em;line-height:1.7}
.news-item a:hover{color:#c0392b;text-decoration:underline}
.news-source{font-size:10px;color:#8b6040;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;flex-shrink:0;border:1px solid #d4c4a8;padding:2px 7px;background:#f8f4ec}
.empty{text-align:center;padding:40px;color:#8b6040;font-family:'Noto Sans JP',sans-serif;font-size:13px;border:1px dashed #c0a070}
.loading{text-align:center;padding:40px;color:#7a5030;font-family:'Noto Sans JP',sans-serif;font-size:13px;letter-spacing:.1em}
.dot{display:inline-block;width:6px;height:6px;background:#8b4513;border-radius:50%;margin:0 3px;animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.hid{display:none!important}
.site-footer{margin-top:40px;padding:16px 0;border-top:1px solid #c0a070;text-align:center;font-family:'Noto Sans JP',sans-serif;font-size:10px;color:#9a7050;line-height:2;letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="site-title">怪獣<span>大図鑑</span></div>
  <div class="site-byline">ULTRAMAN SERIES</div>
  <div class="stamp">非公式ファンサイト</div>
</header>

<nav>
  <a class="nav-tab active" href="index.html">← 怪獣検索</a>
  <a class="nav-tab" href="index.html">▶ クイズ</a>
  <a class="nav-tab" href="index.html">▶ お気に入り</a>
  <a class="nav-tab" href="ultraman_list.html" style="border-right:none">▶ ウルトラマン</a>
</nav>

<div class="page-heading">最新情報</div>
<div class="page-meta" id="page-meta"></div>

<div id="loading" class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><br><br>読み込み中…</div>
<div id="empty" class="empty hid">現在表示できるニュースがありません</div>

<div class="news-box hid" id="news-box">
  <ul class="news-list" id="news-list"></ul>
</div>

</div>

<footer class="site-footer">
  このサイトは非公式のファンサイトです。円谷プロダクションとは一切関係ありません。<br>
  ウルトラマンシリーズに関するすべての著作権は © TSUBURAYA PRODUCTIONS CO., LTD. に帰属します。
</footer>

<script>
function show(id) { document.getElementById(id).classList.remove('hid'); }
function hide(id) { document.getElementById(id).classList.add('hid'); }

async function init() {
  try {
    const res = await fetch('data/news.json');
    if (!res.ok) throw new Error();
    const news = await res.json();
    hide('loading');
    if (!news.length) { show('empty'); return; }

    document.getElementById('page-meta').textContent =
      `${news.length}件 ／ 最終更新: ${(news[0]?.date || '').replace(/-/g, '.')}`;

    document.getElementById('news-list').innerHTML = news.map(n => `
      <li class="news-item">
        <span class="news-date">${n.date.replace(/-/g, '.')}</span>
        <a href="${n.url}" target="_blank" rel="noopener noreferrer">${n.title}</a>
        <span class="news-source">${n.source}</span>
      </li>`).join('');

    show('news-box');
  } catch(e) {
    hide('loading');
    show('empty');
  }
}

init();
</script>
</body>
</html>
